<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Student Record Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-header">
                <div class="login-icon">🎓</div>
                <h1>Student Manager</h1>
                <p class="login-subtitle">Sign in to continue</p>
            </div>

            {% if error %}
            <div class="login-error">
                <span>⚠️</span> {{ error }}
            </div>
            {% endif %}

            {% if reg_success %}
            <div class="login-success">
                <span>✅</span> {{ reg_success }}
            </div>
            {% endif %}

            <form method="POST" class="login-form">

                <div class="login-field">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autofocus
                    >
                </div>

                <div class="login-field">
                    <div class="login-field-header">
                        <label for="password">Password</label>
                        <a href="{{ url_for('forgot_password') }}" class="forgot-link">Forgot Password?</a>
                    </div>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn">
                    Sign In →
                </button>

            </form>

            <p class="login-hint">
                Don't have an account?
                <a href="{{ url_for('register') }}" class="create-account-link">Create Account</a>
            </p>

        </div>
    </div>

</body>

</html>
