<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if student %}Edit Student{% else %}Add Student{% endif %}
    </title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-container">

        <h1>
            {% if student %}
            Edit Student
            {% else %}
            Add Student
            {% endif %}
        </h1>

        <form method="POST">

            <label>Name</label>
            <input type="text" name="name" value="{{ student[1] if student else '' }}" required>

            <label>Email</label>
            <input type="email" name="email" value="{{ student[2] if student else '' }}" required>

            <label>Course</label>
            <input type="text" name="course" value="{{ student[3] if student else '' }}" required>

            <button type="submit" class="save-btn">
                Save Student
            </button>

            <a href="{{ url_for('index') }}" class="cancel-btn">
                Cancel
            </a>

        </form>

    </div>

</body>

</html>
