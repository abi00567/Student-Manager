<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Record Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Record Manager</h1>

        <a href="{{ url_for('add_student') }}" class="add-btn">
            + Add Student
        </a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for student in students %}
                <tr>
                    <td>{{ student[0] }}</td>
                    <td>{{ student[1] }}</td>
                    <td>{{ student[2] }}</td>
                    <td>{{ student[3] }}</td>
                    <td>
                        <a href="{{ url_for('edit_student', id=student[0]) }}" class="edit-btn">
                            Edit
                        </a>

                        <button class="delete-btn" data-id="{{ student[0] }}">
                            Delete
                        </button>
                    </td>
                </tr>

                {% else %}

                <tr>
                    <td colspan="5">No students found.</td>
                </tr>

                {% endfor %}
            </tbody>
        </table>

    </div>

    <script src="{{ url_for('static', filename='main.js') }}"></script>

</body>

</html>
