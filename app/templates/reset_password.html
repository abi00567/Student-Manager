<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Student Record Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="login-body">

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-header">
                <div class="login-icon">🔓</div>
                <h1>Reset Password</h1>
                <p class="login-subtitle">
                    Setting new password for <strong style="color:#2563eb;">{{ username }}</strong>
                </p>
            </div>

            {% if error %}
            <div class="login-error">
                <span>⚠️</span> {{ error }}
            </div>
            {% endif %}

            {% if success %}
            <div class="login-success">
                <span>✅</span> {{ success }}
                <a href="{{ url_for('login') }}" class="create-account-link" style="margin-left:6px;">Sign In now →</a>
            </div>
            {% endif %}

            {% if not success %}
            <form method="POST" class="login-form">

                <div class="login-field">
                    <label for="password">New Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                        autofocus
                        minlength="6"
                    >
                </div>

                <div class="login-field">
                    <label for="confirm_password">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter new password"
                        required
                        minlength="6"
                    >
                </div>

                <button type="submit" class="login-btn">
                    Reset Password
                </button>

            </form>
            {% endif %}

            <p class="login-hint">
                <a href="{{ url_for('forgot_password') }}" class="create-account-link">← Back</a>
                &nbsp;|&nbsp;
                <a href="{{ url_for('login') }}" class="create-account-link">Sign In</a>
            </p>

        </div>
    </div>

</body>

</html>
